server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: se pueden cachear mucho tiempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta (/pedidos, /admin...) devuelve index.html y la resuelve React Router
    location / {
        try_files $uri /index.html;
    }
}
